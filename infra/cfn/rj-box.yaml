AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Rift Jumpers box (RJ 463): the security group rj-public (HTTPS for Caddy, the alpha and dev game-server UDP
  ranges, SSH from listed CIDRs) and the api / api-dev / play A records. Deploy in the box's region (us-west-1).
  The instance and its old security group are not managed here: infra/deploy_stacks.sh attaches rj-public beside
  the old group, which keeps TCP 3000 and UDP 8080-8085 open for today's builds until cutover. Since RJ 487 also the
  load alarms: the SNS topic rj-alerts (email) and six CloudWatch alarms, on EC2's own metrics and on the box's
  reporter (infra/box/report_metrics.sh, namespace RiftJumpers/Box).

Parameters:
  DomainName:
    Type: String
    Default: riftjumpers.space
    AllowedPattern: '^[a-z0-9-]+(\.[a-z0-9-]+)+$'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The existing public hosted zone for DomainName.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The box's VPC.
  BoxPublicIp:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    Description: The box's public IPv4 address, which the A records point at.
  SshCidr1:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: A CIDR allowed to SSH (port 22).
  SshCidr2:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Another CIDR allowed to SSH, or empty.
  SshCidr3:
    Type: String
    Default: ''
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Another CIDR allowed to SSH, or empty.
  RecordTtl:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 86400
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: The box, whose EC2 metrics the alarms watch.
  AlertEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Where the alarms email (RJ_ALERT_EMAIL in deploy.env; kept out of git, the repository is public).

Conditions:
  HasSsh2: !Not [!Equals [!Ref SshCidr2, '']]
  HasSsh3: !Not [!Equals [!Ref SshCidr3, '']]

Resources:
  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: rj-public
      GroupDescription: Rift Jumpers - Caddy HTTPS, game servers (alpha 8090-8099, dev 8100-8104), SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: ACME HTTP challenge and the redirect to HTTPS (Caddy)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: api / api-dev over HTTPS (Caddy)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: alpha game servers (ENet)
          IpProtocol: udp
          FromPort: 8090
          ToPort: 8099
          CidrIp: 0.0.0.0/0
        - Description: dev game servers (ENet)
          IpProtocol: udp
          FromPort: 8100
          ToPort: 8104
          CidrIp: 0.0.0.0/0
        - Description: SSH
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr1
        - !If
          - HasSsh2
          - Description: SSH
            IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SshCidr2
          - !Ref AWS::NoValue
        - !If
          - HasSsh3
          - Description: SSH
            IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SshCidr3
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: rj-public
        - Key: project
          Value: rift-jumpers

  ApiRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${DomainName}.'
      Type: A
      TTL: !Ref RecordTtl
      ResourceRecords: [!Ref BoxPublicIp]

  ApiDevRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api-dev.${DomainName}.'
      Type: A
      TTL: !Ref RecordTtl
      ResourceRecords: [!Ref BoxPublicIp]

  PlayRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'play.${DomainName}.'
      Type: A
      TTL: !Ref RecordTtl
      ResourceRecords: [!Ref BoxPublicIp]

  # --- load alarms (RJ 487) --------------------------------------------------------------------------------------
  # Each emails rj-alerts when it starts and again when it clears. Thresholds from the measured capacity (Wobble
  # Planet docs/backend-ops.md, "Capacity"): ~529 MB available at idle, ~105 MB per match, 2 matches comfortable.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rj-alerts
      DisplayName: RJ alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: project
          Value: rift-jumpers

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rj-box-status-check
      AlarmDescription: The box or its host fails EC2's status checks.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rj-box-cpu-high
      AlarmDescription: Sustained CPU over 70% for 15 min (a match is ~4%).
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  CpuCreditsLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rj-box-cpu-credits-low
      AlarmDescription: CPU credits under 30 of 144; a t2 slows hard when they run out.
      Namespace: AWS/EC2
      MetricName: CPUCreditBalance
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  MemoryLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rj-box-memory-low
      AlarmDescription: Under 200 MB of memory available for 10 min; room for about one more match.
      Namespace: RiftJumpers/Box
      MetricName: MemAvailableMB
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 200
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  MatchesHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rj-box-matches-high
      AlarmDescription: More than 2 matches at once for 10 min, dev and alpha together; time to resize (RJ 474).
      Namespace: RiftJumpers/Box
      MetricName: ActiveMatches
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ReporterSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rj-box-reporter-silent
      AlarmDescription: No sample from rj-report-metrics for 15 min; the reporter or the box has stopped.
      Namespace: RiftJumpers/Box
      MetricName: MemAvailableMB
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
  SecurityGroupId:
    Value: !Ref PublicSecurityGroup
  BoxPublicIp:
    Value: !Ref BoxPublicIp
